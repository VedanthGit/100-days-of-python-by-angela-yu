{% extends "base.html" %}
{% block content %}

<h2>Contact Me</h2>

<form method="post">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Your Mail" required>
    <textarea name="message" id="Your Message"></textarea>
    <button type="submit">Send</button>
</form>

{% endblock %}
