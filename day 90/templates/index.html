<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dangerous Writer</title>
    <link rel="stylesheet" href="../static/style.css">
    <script defer src="../static/app.js"></script>
</head>

<body>
    <header>
        <h1>Dangerous Writer</h1>
        <p>If you stop writing, your work will disappear.</p>
    </header>

    <main>
        <div class="status">
            <span id="timer">5.0s</span>
            <span id="words">0 Words</span>
        </div>

        <textarea id="editor" placeholder="Start typing. Don't stop"></textarea>

        <div class="controls">
            <button id="reset">Reset</button>
        </div>
    </main>
</body>

</html>
